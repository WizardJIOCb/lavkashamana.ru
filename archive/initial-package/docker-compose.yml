services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shaman
      POSTGRES_USER: shaman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaman"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shaman:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/shaman
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shaman:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/shaman
    command: ["python","-m","app.bot"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
