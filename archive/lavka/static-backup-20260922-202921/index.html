<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#f3ead8"/>
  <title>Лавка шамана</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/shaman-style-v4.css?v=4"/>
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <img src="/logo.jpg" alt="Лавка шамана" class="logo"/>
      <div>
        <div class="eyebrow">TELEGRAM MINI APP</div>
        <h1>Лавка шамана</h1>
        <p>Природные продукты, чай, травы, мёд и масла — в одном месте.</p>
      </div>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button data-tab="shop" class="active">Лавка</button>
      <button data-tab="cart">Корзина <span id="cartBadge"></span></button>
      <button data-tab="profile">Профиль</button>
      <button data-tab="admin" id="adminTab">Админ</button>
    </nav>
  </div>

  <template id="toastTpl"><div class="toast"></div></template>
  <script src="/app-admin-v4.js"></script>
</body>
</html>
