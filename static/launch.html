<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Лавка Шамана</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{
 margin:0;padding:0;width:100%;height:100%;
 background:#000;overflow:hidden;
}
#intro{
 position:fixed;
 inset:0;
 width:100vw;
 height:100vh;
 height:100dvh;
 background:#000;
 z-index:2147483647;
 overflow:hidden;
}
#introVideo{
 z-index:1;
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center center;
 background:#000;
}
#fallback{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;
 font-family:Arial,sans-serif;
 font-size:24px;
 background:#000;
 z-index:0;
}
</style>
</head>
<body>
<div id="intro">
 <div id="fallback">Лавка Шамана</div>
 <video id="introVideo" autoplay muted playsinline webkit-playsinline preload="auto">
   <source src="/intro.mp4?v=1790949766" type="video/mp4">
 </video>
</div>

<script>
(function(){
 const video=document.getElementById("introVideo");

 try{
   const tg=window.Telegram&&window.Telegram.WebApp;
   if(tg){
     tg.ready();
     tg.expand();
     try{tg.setHeaderColor("#000000");}catch(e){}
     try{tg.setBackgroundColor("#000000");}catch(e){}
     try{if(tg.requestFullscreen)tg.requestFullscreen();}catch(e){}
   }
 }catch(e){}

 function openLavka(){
   let q=location.search||"";
   let h=location.hash||"";
   location.replace("/"+q+h);
 }

 function play(){
   video.muted=true;
   video.defaultMuted=true;
   const p=video.play();
   if(p&&p.catch)p.catch(()=>{});
 }

 video.addEventListener("loadeddata",play,{once:true});
 video.addEventListener("canplay",play,{once:true});
 video.addEventListener("ended",openLavka,{once:true});
 video.addEventListener("error",()=>setTimeout(openLavka,1500),{once:true});

 document.addEventListener("touchstart",play,{once:true,passive:true});
 document.addEventListener("pointerdown",play,{once:true});

 play();

 setTimeout(play,300);
 setTimeout(play,800);
 setTimeout(openLavka,10000);
})();
</script>
</body>
</html>
